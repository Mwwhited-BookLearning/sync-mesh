# Composite: all six deployment models in docs/08-deployment-models.md at
# once — `docker compose up -d` starts every model's infrastructure
# simultaneously (ports are pre-allocated distinctly across all six, so
# nothing conflicts). Each model also has its own standalone file under
# deploy/compose/ if you only want one at a time — see
# docs/10-running-deployment-models.md.
#
# Deliberately NOT the same containers SyncMesh.AppHost orchestrates —
# AppHost is the single, fixed local-dev topology (Phase 2); this file (and
# deploy/compose/*.yml) is a sandbox for standing up any of the six
# *documented* topology shapes on demand, without touching AppHost's own
# config.
#
# Server-mesh nodes (intra-site-mesh, full-mesh) are plain standalone
# JetStream servers with no special NATS-level config between them —
# server-mesh replication is point-to-point at the application layer
# (ServerMeshOptions.Peers / MeshForwarder dialing each peer's URL
# directly), not native NATS gateway clustering. See
# docs/adr/0002-nats-leaf-nodes-for-transport.md's 2026-07-23 (Phase 3)
# Amendment.
name: sync-mesh-deployment-models

include:
  - deploy/compose/client-isolated.yml
  - deploy/compose/client-onprem.yml
  - deploy/compose/client-cloud.yml
  - deploy/compose/standalone-server.yml
  - deploy/compose/intra-site-mesh.yml
  - deploy/compose/full-mesh.yml
