# Shared config for every "standalone" node across the selectable
# deployment models (client-isolated, standalone-server, intra-site-mesh,
# full-mesh) — no leafnodes block, since these models don't need a
# leaf/hub split: server-mesh replication is point-to-point at the
# application layer (MeshForwarder dialing each peer's own URL directly),
# not native NATS gateway clustering. See docs/adr/0002-nats-leaf-nodes-
# for-transport.md's 2026-07-23 (Phase 3) Amendment. server_name is set
# via each container's own resource name in AppHost.cs, so this one file
# covers every such node — same convention as deploy/nats-config/
# plain-jetstream.conf (that file's own copy, for the standalone
# docker-compose sandbox, not shared from here to keep each side
# self-contained).
port: 4222

jetstream {
    store_dir: "/data"
}
