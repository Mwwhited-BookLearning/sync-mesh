# client-cloud deployment model's daemon leaf node — dials out to this
# model's own hub. See docs/adr/0002-nats-leaf-nodes-for-transport.md.
port: 4222
server_name: nats-leaf-cloud

jetstream {
    store_dir: "/data"
}

leafnodes {
    remotes: [
        { url: "nats-leaf://nats-hub-cloud:7422" }
    ]
}
