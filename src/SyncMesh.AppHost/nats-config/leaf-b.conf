# Site B daemon's embedded local NATS leaf node — dials out to site B's
# nearest-server hub. See docs/adr/0002-nats-leaf-nodes-for-transport.md.
port: 4222
server_name: nats-leaf-b

jetstream {
    store_dir: "/data"
}

leafnodes {
    remotes: [
        { url: "nats-leaf://nats-hub-b:7422" }
    ]
}
