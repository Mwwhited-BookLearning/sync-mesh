# Deployment model 3: Client -> cloud server (no on-prem tier) — see
# docs/08-deployment-models.md and docs/10-running-deployment-models.md.
# Standalone use: `docker compose -f deploy/compose/client-cloud.yml up -d`.
# Also pulled into the repo-root docker-compose.yml (all six models at once)
# via `include:`.
name: sync-mesh-client-cloud

services:
  postgres-cloud:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: EventStore
    ports:
      - "25433:5432"

  nats-hub-cloud:
    image: nats:2-alpine
    volumes:
      - ../nats-config/cloud-hub.conf:/etc/nats/nats-server.conf:ro
    command: ["-c", "/etc/nats/nats-server.conf"]
    ports:
      - "24225:4222"

  nats-leaf-cloud:
    image: nats:2-alpine
    volumes:
      - ../nats-config/cloud-leaf.conf:/etc/nats/nats-server.conf:ro
    command: ["-c", "/etc/nats/nats-server.conf"]
    depends_on:
      - nats-hub-cloud
    ports:
      - "24226:4222"
